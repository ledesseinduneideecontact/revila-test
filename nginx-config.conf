# Configuration Nginx pour Revila
# À placer dans /etc/nginx/sites-available/revila

# Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.com www.votre-domaine.com;

    # Redirection vers HTTPS
    return 301 https://$server_name$request_uri;
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name votre-domaine.com www.votre-domaine.com;

    # Certificats SSL (Let's Encrypt)
    # Ces chemins seront automatiquement configurés par certbot
    ssl_certificate /etc/letsencrypt/live/votre-domaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/votre-domaine.com/chain.pem;

    # Configuration SSL moderne et sécurisée
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Headers de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Taille max des uploads (ajuster selon vos besoins)
    client_max_body_size 100M;

    # Logs
    access_log /var/log/nginx/revila-access.log;
    error_log /var/log/nginx/revila-error.log;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Proxy vers l'application Next.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # Headers pour le proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }

    # Cache pour les fichiers statiques Next.js
    location /_next/static {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache agressif pour les fichiers statiques
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache pour les images optimisées Next.js
    location /_next/image {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache pour les images
        add_header Cache-Control "public, max-age=86400";
    }

    # Fichiers statiques publics
    location /public {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        add_header Cache-Control "public, max-age=3600";
    }

    # Bloquer l'accès aux fichiers sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Favicon
    location = /favicon.ico {
        proxy_pass http://localhost:3000;
        log_not_found off;
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        proxy_pass http://localhost:3000;
        log_not_found off;
        access_log off;
    }
}

# INSTRUCTIONS D'INSTALLATION :
#
# 1. Remplacer "votre-domaine.com" par votre vrai domaine
#
# 2. Copier ce fichier sur le serveur :
#    sudo nano /etc/nginx/sites-available/revila
#    (coller le contenu)
#
# 3. Créer le lien symbolique :
#    sudo ln -s /etc/nginx/sites-available/revila /etc/nginx/sites-enabled/
#
# 4. Supprimer la config par défaut si elle existe :
#    sudo rm /etc/nginx/sites-enabled/default
#
# 5. Tester la configuration :
#    sudo nginx -t
#
# 6. Redémarrer Nginx :
#    sudo systemctl restart nginx
#
# 7. Installer SSL avec Certbot :
#    sudo certbot --nginx -d votre-domaine.com -d www.votre-domaine.com
#
# NOTES :
# - Les chemins des certificats SSL seront automatiquement mis à jour par certbot
# - Certbot renouvelle automatiquement les certificats tous les 90 jours
# - La taille max d'upload est fixée à 100M (ajustable selon vos besoins)
# - La compression gzip est activée pour améliorer les performances
# - Les headers de sécurité suivent les meilleures pratiques 2024
