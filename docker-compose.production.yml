version: '3.8'

services:
  # Application Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: revila-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Monter le dossier pour les uploads si nécessaire
      - ./uploads:/app/uploads
      # Logs
      - ./logs:/app/.next/standalone/logs
      # Fichiers temporaires pour le traitement vidéo
      - ./tmp:/app/tmp
      - ./outputs:/app/outputs
    networks:
      - revila-network
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Base de données PostgreSQL (si vous en avez besoin)
  db:
    image: postgres:15-alpine
    container_name: revila-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-revila}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - revila-network
    ports:
      # Exposer uniquement en local (pour maintenance)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revila}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis pour le cache (optionnel)
  # redis:
  #   image: redis:7-alpine
  #   container_name: revila-redis
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - revila-network
  #   command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

networks:
  revila-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  # redis-data:
  #   driver: local
